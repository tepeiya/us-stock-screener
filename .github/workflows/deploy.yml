name: 部署选股器

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 部署到gh-pages分支
        run: |
          git config user.name "tepeiya"
          git config user.email "tepeiya@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          git checkout main -- screener.html screener-style.css screener-data.js manifest.json sw.js icon-192.png icon-512.png version.json
          git add .
          git commit -m "deploy: $(date '+%Y-%m-%d %H:%M')"
          git push origin gh-pages --force
